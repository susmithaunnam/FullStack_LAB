<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Registration</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
<div class="registration">
    <h1>Student Details</h1>
    <form>
        <label>Name</label>
        <input type="text" id="name" placeholder="Enter Your Name">
        <label>Age</label>
        <input type="number" id="age" placeholder="Enter Age">

        <label>Gender</label>
        <table>
            <tr>
                <td><input type="radio" name="gender"></td>
                <td>Male</td>
            </tr>
            <tr>
                <td><input type="radio" name="gender"></td>
                <td>Female</td>
            </tr>
        </table>
        <label>Date Of Birth</label>
        <input type="date">
        <label>Mother Name</label>
        <input type="text" placeholder="Enter Your Mother Name">
        <label>Father Name</label>
        <input type="text" placeholder="Enter Your Father Name">
        <label>Student Phone Number</label>
        <input type="number">
        <label>Father Phone Number</label>
        <input type="number">
        <label>Mother Phone Number</label>
        <input type="number">
        <label>Email</label>
        <input type="email" placeholder="abc@gmail.com" id="Email">
        <label>Interested Domain</label>
        <table>
            <tr>
                <td><input type="checkbox" name="Domain"></td>
                <td>Computer Science</td>
            </tr>
            <tr>
                <td><input type="checkbox" name="Domain"></td>
                <td>Electronics</td>
            </tr>
            <tr>
                <td><input type="checkbox" name="Domain"></td>
                <td>Mathematics</td>
            </tr>
            <tr>
                <td><input type="checkbox" name="Domain"></td>
                <td>Language and Literature</td>
            </tr>
            <tr>
                <td><input type="checkbox" name="Domain"></td>
                <td>Co-Curricular Activities</td>
            </tr>
        </table>
        <button type="submit">Submit</button>
    </form>
</div>
</body>
</html>
