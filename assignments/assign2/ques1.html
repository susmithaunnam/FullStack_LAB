<!DOCTYPE html>
<html lang="en">
<!DOCTYPE html>
<html>
<head>
    <title>Mark Average Calculator</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        text-align: center;
        margin: 0;
        padding: 30px;
    }

    h1 {
        color: #333;
        margin-bottom: 30px;
    }

    .container {
        width: 400px;
        margin: auto;
        background-color: white;
        padding: 30px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #333;
    }

    input {
        width: 250px;
        padding: 8px;
        margin-bottom: 10px;
        box-sizing: border-box;
    }

    button {
        background-color: #337ab7;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 14px;
    }

    button:hover {
        background-color: #286090;
    }

    #marksContainer {
        margin-top: 25px;
    }

    #result {
        margin-top: 25px;
        color: #222;
        font-size: 16px;
        line-height: 1.8;
    }
</style>
</head>

<body>
    <h1>Mark Average Calculator</h1>
    <label>Number of Subjects:</label>
    <input type="number" id="subjectCount" min="1">
    <button onclick="generateFields()">Generate Input Fields</button>
    <br><br>
    <div id="marksContainer"></div>
    <br>
    <button onclick="calculateResult()">
        Calculate Average & Percentage
    </button>
    <div id="result"></div>
    <script>
        function generateFields() {

            let count = document.getElementById("subjectCount").value;

            let container = document.getElementById("marksContainer");

            container.innerHTML = "";

            for (let i = 1; i <= count; i++) {

                let label = document.createElement("label");
                label.innerHTML = "Subject " + i + ": ";

                let input = document.createElement("input");
                input.type = "number";
                input.id = "mark" + i;
                input.min = "0";
                input.max = "100";

                container.appendChild(label);
                container.appendChild(input);

                container.appendChild(document.createElement("br"));
                container.appendChild(document.createElement("br"));
            }
        }
        function calculateResult() {

            let count = document.getElementById("subjectCount").value;

            let total = 0;

            for (let i = 1; i <= count; i++) {

                let mark = Number(document.getElementById("mark" + i).value);

                total = total + mark;
            }

            let average = total / count;

            let percentage = (total / (count * 100)) * 100;

            let grade;

            if (percentage >= 90) {
                grade = "A+";
            }
            else if (percentage >= 80) {
                grade = "A";
            }
            else if (percentage >= 70) {
                grade = "B";
            }
            else if (percentage >= 60) {
                grade = "C";
            }
            else if (percentage >= 50) {
                grade = "D";
            }
            else {
                grade = "F";
            }
            document.getElementById("result").innerHTML =
                "<h3>Result</h3>" +
                "<p>Total Marks: " + total + "</p>" +
                "<p>Average: " + average.toFixed(2) + "</p>" +
                "<p>Percentage: " + percentage.toFixed(2) + "%</p>" +
                "<p>Grade: " + grade + "</p>";
        }
    </script>
</body>
</html>
