<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>

<body>

<center>
<h1>Student Registration Form</h1>
</center>

<form action="register.php" method="post">

    <!-- Personal Information -->
    <fieldset>
        <legend><b>Personal Information</b></legend>

        <table cellpadding="8">

            <tr>
                <td><label for="fname">Full Name</label></td>
                <td>
                    <input type="text" id="fname" name="fullname"
                    placeholder="Enter your full name">
                </td>
            </tr>

            <tr>
                <td><label for="pwd">Password</label></td>
                <td>
                    <input type="password" id="pwd" name="password"
                    placeholder="Enter password">
                </td>
            </tr>

            <tr>
                <td><label for="email">Email Address</label></td>
                <td>
                    <input type="email" id="email" name="email"
                    placeholder="abc@example.com">
                </td>
            </tr>

            <tr>
                <td><label for="mobile">Mobile Number</label></td>
                <td>
                    <input type="tel" id="mobile" name="mobile"
                    placeholder="9876543210">
                </td>
            </tr>

            <tr>
                <td><label for="age">Age</label></td>
                <td>
                    <input type="number" id="age" name="age">
                </td>
            </tr>

            <tr>
                <td><label for="dob">Date of Birth</label></td>
                <td>
                    <input type="date" id="dob" name="dob">
                </td>
            </tr>

            <tr>
                <td><label for="time">Preferred Time</label></td>
                <td>
                    <input type="time" id="time" name="time">
                </td>
            </tr>

            <tr>
                <td><label for="datetime">Registration Date & Time</label></td>
                <td>
                    <input type="datetime-local" id="datetime"
                    name="datetime">
                </td>
            </tr>

        </table>

    </fieldset>

    <br>

    <!-- Academic Information -->
    <fieldset>

        <legend><b>Academic Information</b></legend>

        <table cellpadding="8">

            <tr>
                <td><label for="dept">Department</label></td>
                <td>
                    <select id="dept" name="department">
                        <option>Select Department</option>
                        <option>CSE</option>
                        <option>ECE</option>
                        <option>EEE</option>
                        <option>IT</option>
                        <option>Mechanical</option>
                        <option>Civil</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label for="language">Programming Language</label></td>
                <td>
                    <input type="text" id="language" name="language">
                </td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="Other">
                    <label for="other">Other</label>
                </td>
            </tr>

            <tr>
                <td>Skills</td>
                <td>
                    <input type="checkbox" id="html" name="skills" value="HTML">
                    <label for="html">HTML</label>

                    <input type="checkbox" id="css" name="skills" value="CSS">
                    <label for="css">CSS</label>

                    <input type="checkbox" id="js" name="skills" value="JavaScript">
                    <label for="js">JavaScript</label>

                    <input type="checkbox" id="java" name="skills" value="Java">
                    <label for="java">Java</label>

                    <input type="checkbox" id="python" name="skills" value="Python">
                    <label for="python">Python</label>
                </td>
            </tr>

        </table>

    </fieldset>

    <br>

    <!-- Online Information -->
    <fieldset>

        <legend><b>Online Information</b></legend>

        <table cellpadding="8">

            <tr>
                <td><label for="website">Portfolio Website</label></td>
                <td>
                    <input type="url" id="website" name="website"
                    placeholder="https://example.com">
                </td>
            </tr>

            <tr>
                <td><label for="search">Search Course</label></td>
                <td>
                    <input type="search" id="search" name="search"
                    placeholder="Search course">
                </td>
            </tr>

            <tr>
                <td><label for="resume">Upload Resume</label></td>
                <td>
                    <input type="file" id="resume" name="resume">
                </td>
            </tr>

            <tr>
                <td><label for="color">Favorite Color</label></td>
                <td>
                    <input type="color" id="color" name="color">
                </td>
            </tr>

            <tr>
                <td><label for="range">Programming Skill Level</label></td>
                <td>
                    Beginner
                    <input type="range" id="range" name="skill"
                    min="0" max="100">
                    Expert
                </td>
            </tr>

            <tr>
                <td><label for="address">Address</label></td>
                <td>
                    <textarea id="address" name="address"
                    rows="4" cols="35"
                    placeholder="Enter your address"></textarea>
                </td>
            </tr>

        </table>

    </fieldset>

    <br>

    <!-- Declaration -->
    <fieldset>

        <legend><b>Declaration</b></legend>

        <input type="checkbox" id="declare" name="declare">

        <label for="declare">
            I hereby declare that the information provided above is true and correct.
        </label>

    </fieldset>

    <br>

    <center>
        <input type="submit" value="Submit Form">
        <input type="reset" value="Reset Form">
        <input type="button" value="Click Me">
    </center>

</form>

</body>
</html>
